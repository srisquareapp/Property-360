<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Property 360">
  <title>Property 360</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="brand">PROPERTY 360</div>
      <div class="subtitle">AP Property Verification</div>
    </div>
    <button id="lang" class="lang">EN / తెలుగు</button>
  </header>

  <main id="main"></main>

  <nav class="bottom-nav">
    <button data-screen="home" class="active">⌂<span>Home</span></button>
    <button data-screen="properties">▣<span>Properties</span></button>
    <button data-screen="customers">♙<span>Customers</span></button>
    <button data-screen="profile">◉<span>Profile</span></button>
  </nav>

  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
